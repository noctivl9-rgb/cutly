# Déploiement Render (service web Node). La base PostgreSQL est externe (Neon recommandé)
# ou une base Render Postgres : renseignez DATABASE_URL dans le tableau de bord.
services:
  - type: web
    name: dossier-x
    runtime: node
    plan: free # une seule instance : la diffusion temps réel est en mémoire (voir docs/deploiement.md)
    region: frankfurt
    branch: dossier-x
    buildCommand: npm ci --omit=dev
    startCommand: node src/server.ts
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.20.0
      - key: DATABASE_URL
        sync: false
      - key: DX_ADMIN_EMAIL
        value: admin@dossier-x.fr
      # Mot de passe administrateur généré par Render : consultable dans Environment.
      - key: DX_ADMIN_PASSWORD
        generateValue: true
      - key: PUBLIC_BASE_URL
        value: https://dossier-x.onrender.com
      - key: PRINT_DOMAIN_CONFIRMED
        value: "false"
      - key: TRUST_PROXY
        value: "1"
