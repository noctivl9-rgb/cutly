services:
  - type: web
    name: cutly-thomas-shop
    runtime: node
    plan: free
    region: frankfurt
    numInstances: 1
    autoDeployTrigger: 'off'
    buildCommand: npm run build && npm test
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: CUTLY_HOST
        value: 0.0.0.0
      - key: CUTLY_DATABASE_URL
        sync: false
      - key: CUTLY_PUBLIC_BASE_URL
        sync: false
      - key: CUTLY_MFA_ENCRYPTION_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: CUTLY_EMAIL_FROM
        sync: false
      - key: CUTLY_JOB_TOKEN
        sync: false
